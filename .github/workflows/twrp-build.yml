name: Build TWRP / OrangeFox - Motorola Signature (vantage)

on:
  workflow_dispatch:
    inputs:
      recovery_type:
        description: 'Qual Recovery compilar? (twrp ou orangefox)'
        required: true
        default: 'twrp'
        type: choice
        options:
          - twrp
          - orangefox
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout da Device Tree (Repositorio Atual)
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Liberar espaco em disco no Runner (Mais de 80 GB livres)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Instalar pacotes de compilacao Android
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 python-is-python3 clang libssl-dev rsync flex bison ccache lz4

      - name: Configurar Git e Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Sincronizar Fonte (TWRP 12.1 Minimal Manifest)
        if: ${{ github.event.inputs.recovery_type != 'orangefox' }}
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          ~/bin/repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Sincronizar Fonte (OrangeFox 12.1)
        if: ${{ github.event.inputs.recovery_type == 'orangefox' }}
        run: |
          git clone https://gitlab.com/OrangeFox/misc/scripts ~/scripts
          cd ~/scripts
          sudo bash setup/android_build_env.sh
          mkdir -p ~/OrangeFox_sync && cd ~/OrangeFox_sync
          bash ~/scripts/orangefox_sync.sh --branch 12.1 --path ~/twrp

      - name: Copiar Device Tree para a Fonte (Motorola Signature - vantage)
        run: |
          mkdir -p ~/twrp/device/motorola/vantage
          cp -r $GITHUB_WORKSPACE/device_tree/* ~/twrp/device/motorola/vantage/
          chmod +x ~/twrp/device/motorola/vantage/recovery/root/system/bin/hw/*
          ls -la ~/twrp/device/motorola/vantage/

      - name: Compilar Recovery Image (recovery.img)
        run: |
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=vantage
          export LC_ALL="C"
          lunch twrp_vantage-eng
          mka adbd recoveryimage -j$(nproc --all)

      - name: Fazer Upload do recovery.img nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Motorola-Signature-vantage-${{ github.sha }}
          path: ~/twrp/out/target/product/vantage/recovery.img
          if-no-files-found: error
